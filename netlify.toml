# FinVault — Netlify deployment
# Stack: React SPA (apps/web) + Express serverless API + Neon PostgreSQL
#
# Required site environment variables (Site settings → Environment variables):
#   DATABASE_URL  — Neon pooled connection string
#   DIRECT_URL    — Neon direct connection string (schema push during build)
#   JWT_SECRET    — Auth signing secret
#   CORS_ORIGINS  — e.g. https://your-site.netlify.app (comma-separated)
#
# Do NOT commit apps/api/.env — set secrets only in Netlify UI.

[build]
  command = "npm run netlify:build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"
  # Netlify sets NODE_ENV=production during install; include devDeps for Prisma CLI
  NPM_FLAGS = "--include=dev"
  CI = "true"

[functions]
  directory = "apps/api/netlify/functions"
  node_bundler = "esbuild"
  # ESM: apps/api/netlify/functions/package.json has "type": "module"
  included_files = [
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**",
    "apps/api/openapi.yaml",
  ]
  external_node_modules = ["@prisma/client"]

[functions."api"]
  timeout = 26
  memory = 1024
  included_files = [
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**",
    "apps/api/prisma/schema.prisma",
    "apps/api/openapi.yaml",
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.deploy-preview.environment]
  NODE_ENV = "production"

[context.production.environment]
  NODE_ENV = "production"

[dev]
  command = "npm run dev -w @finvault/web"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
