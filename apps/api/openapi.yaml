# ── COMPONENTS ───────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID

  responses:
    BadRequest:
      description: Validation or business-logic error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Insufficient funds
            code: INSUFFICIENT_FUNDS
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Forbidden
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Account not found

  schemas:

    # ── Error ──────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable error code (optional)

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    # ── Auth ───────────────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Min 8 chars, must contain uppercase, lowercase, and digit
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          description: E.164 format, optional

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Bearer JWT
        user:
          $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [CUSTOMER, ADMIN]

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            phone:
              type: string
              nullable: true
            preferences:
              $ref: '#/components/schemas/UserPreferences'

    UserPreferences:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        notificationsEmail:
          type: boolean
        notificationsSms:
          type: boolean
        currency:
          type: string
          enum: [USD, EUR, GBP]

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
        preferences:
          $ref: '#/components/schemas/UserPreferences'

    # ── Accounts ───────────────────────────────────────────────────────────

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [CHECKING, SAVINGS, MONEY_MARKET, CD]
        status:
          type: string
          enum: [ACTIVE, FROZEN, CLOSED]
        balance:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAccountRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [CHECKING, SAVINGS, MONEY_MARKET, CD]
        initialDeposit:
          type: number
          minimum: 0

    AmountMemoRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0.01
        memo:
          type: string
          maxLength: 200

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, TRANSFER_IN, TRANSFER_OUT, BILL_PAY]
        amount:
          type: number
          description: Positive for credits, negative for debits
        balanceAfter:
          type: number
        memo:
          type: string
          nullable: true
        referenceId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Transfers ──────────────────────────────────────────────────────────

    Transfer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
          nullable: true
        externalAccountNumber:
          type: string
          nullable: true
        externalRoutingNumber:
          type: string
          nullable: true
        amount:
          type: number
        status:
          type: string
          enum: [PENDING, COMPLETED, CANCELLED]
        memo:
          type: string
          nullable: true
        scheduledDate:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateTransferRequest:
      type: object
      required: [fromAccountId, amount]
      properties:
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
          description: Required if not sending to external account
        externalAccountNumber:
          type: string
          pattern: '^\d{8,17}$'
        externalRoutingNumber:
          type: string
          pattern: '^\d{9}$'
        amount:
          type: number
          minimum: 0.01
        memo:
          type: string
          maxLength: 200
        scheduledDate:
          type: string
          format: date-time
          description: ISO 8601. If future, transfer is queued as PENDING.

    # ── Payees / Bills ─────────────────────────────────────────────────────

    Payee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        nickname:
          type: string
          nullable: true
        accountNumber:
          type: string
        routingNumber:
          type: string
        createdAt:
          type: string
          format: date-time

    CreatePayeeRequest:
      type: object
      required: [name, accountNumber, routingNumber]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        accountNumber:
          type: string
          pattern: '^\d{4,17}$'
        routingNumber:
          type: string
          pattern: '^\d{9}$'
        nickname:
          type: string
          maxLength: 50

    BillPayment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        fromAccountId:
          type: string
          format: uuid
        amount:
          type: number
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
        dueDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    BillPayRequest:
      type: object
      required: [payeeId, fromAccountId, amount]
      properties:
        payeeId:
          type: string
          format: uuid
        fromAccountId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.01
        dueDate:
          type: string
          format: date-time

    # ── Cards ──────────────────────────────────────────────────────────────

    Card:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        lastFour:
          type: string
          description: Last 4 digits of card number
        brand:
          type: string
          enum: [VISA, MASTERCARD, AMEX]
        status:
          type: string
          enum: [ACTIVE, FROZEN, CANCELLED]
        dailyLimit:
          type: number
          default: 5000
        linkedAccountId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Budgets ────────────────────────────────────────────────────────────

    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        monthlyLimit:
          type: number
        spent:
          type: number
        alertAt:
          type: number
          nullable: true
          description: Absolute amount at which to trigger alert
        createdAt:
          type: string
          format: date-time

    CreateBudgetRequest:
      type: object
      required: [name, category, monthlyLimit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: string
          minLength: 1
          maxLength: 50
        monthlyLimit:
          type: number
          minimum: 0.01
          maximum: 1000000

    # ── Investments ────────────────────────────────────────────────────────

    Portfolio:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/Holding'

    Holding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        portfolioId:
          type: string
          format: uuid
        symbol:
          type: string
        quantity:
          type: number
        avgCost:
          type: number
          description: Average cost basis per share

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        portfolioId:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: number
        orderType:
          type: string
          enum: [MARKET, LIMIT]
        limitPrice:
          type: number
          nullable: true
        status:
          type: string
          enum: [PENDING, FILLED, CANCELLED]
        createdAt:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required: [portfolioId, symbol, side, quantity, orderType]
      properties:
        portfolioId:
          type: string
          format: uuid
        symbol:
          type: string
          minLength: 1
          maxLength: 10
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: number
          minimum: 0.01
          maximum: 10000
        orderType:
          type: string
          enum: [MARKET, LIMIT]
        limitPrice:
          type: number
          minimum: 0.01
          description: Required when orderType is LIMIT

    WatchlistItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        symbol:
          type: string
        price:
          type: number
          description: Simulated current price
        change:
          type: number
          description: Simulated price change

    # ── Loans ──────────────────────────────────────────────────────────────

    Loan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [PERSONAL, AUTO, MORTGAGE]
        amount:
          type: number
          description: Original loan amount
        termMonths:
          type: integer
        rate:
          type: number
          description: Annual interest rate (%)
        status:
          type: string
          enum: [PENDING, APPROVED, ACTIVE, PAID_OFF, DEFAULTED]
        balance:
          type: number
          description: Remaining balance
        purpose:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    LoanApplyRequest:
      type: object
      required: [type, amount, termMonths]
      properties:
        type:
          type: string
          enum: [PERSONAL, AUTO, MORTGAGE]
        amount:
          type: number
          minimum: 1
          maximum: 5000000
        termMonths:
          type: integer
          minimum: 6
          maximum: 360
        purpose:
          type: string
          maxLength: 500

    # ── Notifications ──────────────────────────────────────────────────────

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ── Admin ──────────────────────────────────────────────────────────────

    AdminUserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
        createdAt:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        entity:
          type: string
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          nullable: true
          properties:
            email:
              type: string