    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
  /auth/forgot-password:
    post:
      tags: [Auth]
  /auth/reset-password:
    post:
      tags: [Auth]
  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
    patch:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
