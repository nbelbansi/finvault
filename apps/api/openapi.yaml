openapi: 3.0.3
info:
  title: FinVault API
  description: |
    Banking simulator API for test automation practice.
    All protected endpoints require a Bearer JWT token obtained via `/auth/login` or `/auth/register`.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
    description: Local development

tags:
  - name: Auth
    description: Authentication and user profile
  - name: Accounts
    description: Bank accounts, deposits, withdrawals
  - name: Transfers
    description: Internal and external transfers
  - name: Payees
    description: Saved payees for bill pay
  - name: Bills
    description: Bill payments
  - name: Cards
    description: Debit/credit cards
  - name: Budgets
    description: Spending budgets
  - name: Investments
    description: Portfolios, orders, watchlist
  - name: Loans
    description: Loan applications and payments
  - name: Notifications
    description: In-app notifications
  - name: Admin
    description: Admin-only operations (requires ADMIN role)

paths:

  # ── AUTH ──────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: john.doe@example.com
              password: Password1
              firstName: John
              lastName: Doe
              phone: "+14155550100"
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: john.doe@example.com
              password: Password1
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (audit event)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset token returned (dev mode — normally only emailed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  resetToken:
                    type: string

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Auth]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── ACCOUNTS ─────────────────────────────────────────────────────────────

  /accounts:
    get:
      tags: [Accounts]
      summary: List all active accounts for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Accounts]
      summary: Create a new account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              name: My Savings
              type: SAVINGS
              initialDeposit: 1000
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Accounts]
      summary: Get account by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Accounts]
      summary: Update account name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Accounts]
      summary: Delete account (balance must be zero)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/transactions:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Accounts]
      summary: List transactions for an account (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/balance:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Accounts]
      summary: Get current balance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
                  currency:
                    type: string
                    example: USD
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/deposit:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Accounts]
      summary: Deposit funds into account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountMemoRequest'
            example:
              amount: 500
              memo: Paycheck
      responses:
        '200':
          description: Updated balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
                  balance:
                    type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Accounts]
      summary: Withdraw funds from account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountMemoRequest'
            example:
              amount: 200
              memo: Rent
      responses:
        '200':
          description: Updated balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
                  balance:
                    type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/close:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Accounts]
      summary: Close account (balance must be zero)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Closed account
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── TRANSFERS ─────────────────────────────────────────────────────────────

  /transfers:
    get:
      tags: [Transfers]
      summary: List transfers for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by transfer status
          schema:
            type: string
            enum: [PENDING, COMPLETED, CANCELLED]
      responses:
        '200':
          description: List of transfers
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Transfers]
      summary: Create a transfer (internal or external, immediate or scheduled)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
            examples:
              internal:
                summary: Internal transfer between own accounts
                value:
                  fromAccountId: "uuid-of-source-account"
                  toAccountId: "uuid-of-dest-account"
                  amount: 250
                  memo: Move to savings
              external:
                summary: External wire
                value:
                  fromAccountId: "uuid-of-source-account"
                  externalAccountNumber: "123456789012"
                  externalRoutingNumber: "021000021"
                  amount: 500
              scheduled:
                summary: Scheduled future transfer
                value:
                  fromAccountId: "uuid-of-source-account"
                  toAccountId: "uuid-of-dest-account"
                  amount: 100
                  scheduledDate: "2025-12-01T10:00:00Z"
      responses:
        '201':
          description: Transfer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer:
                    $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /transfers/scheduled:
    get:
      tags: [Transfers]
      summary: List pending scheduled transfers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scheduled transfers
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Transfers]
      summary: Get a transfer by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transfer details
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer:
                    $ref: '#/components/schemas/Transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /transfers/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Transfers]
      summary: Cancel a pending transfer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cancelled transfer
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer:
                    $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── PAYEES ────────────────────────────────────────────────────────────────

  /payees:
    get:
      tags: [Payees]
      summary: List saved payees
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payees
          content:
            application/json:
              schema:
                type: object
                properties:
                  payees:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payee'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Payees]
      summary: Add a new payee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayeeRequest'
            example:
              name: Electric Company
              accountNumber: "00123456"
              routingNumber: "021000021"
              nickname: Power Bill
      responses:
        '201':
          description: Payee created
          content:
            application/json:
              schema:
                type: object
                properties:
                  payee:
                    $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payees/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Payees]
      summary: Update payee name or nickname
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                nickname:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: Updated payee
          content:
            application/json:
              schema:
                type: object
                properties:
                  payee:
                    $ref: '#/components/schemas/Payee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Payees]
      summary: Delete a payee
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── BILLS ─────────────────────────────────────────────────────────────────

  /bills:
    get:
      tags: [Bills]
      summary: List bill payments (most recent first)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bill payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillPayment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bills/history:
    get:
      tags: [Bills]
      summary: List last 50 bill payments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bill payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillPayment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bills/pay:
    post:
      tags: [Bills]
      summary: Pay a bill immediately
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillPayRequest'
            example:
              payeeId: "uuid-of-payee"
              fromAccountId: "uuid-of-account"
              amount: 120
      responses:
        '201':
          description: Bill payment processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill:
                    $ref: '#/components/schemas/BillPayment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bills/schedule:
    post:
      tags: [Bills]
      summary: Schedule a future bill payment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillPayRequest'
            example:
              payeeId: "uuid-of-payee"
              fromAccountId: "uuid-of-account"
              amount: 120
              dueDate: "2025-12-15T09:00:00Z"
      responses:
        '201':
          description: Bill payment scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill:
                    $ref: '#/components/schemas/BillPayment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── CARDS ─────────────────────────────────────────────────────────────────

  /cards:
    get:
      tags: [Cards]
      summary: List cards for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Cards]
      summary: Issue a new card
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                linkedAccountId:
                  type: string
                  format: uuid
                brand:
                  type: string
                  enum: [VISA, MASTERCARD, AMEX]
                  default: VISA
            example:
              linkedAccountId: "uuid-of-account"
              brand: VISA
      responses:
        '201':
          description: Card issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cards/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Cards]
      summary: Update card linked account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                linkedAccountId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Updated card
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cards/{id}/freeze:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Cards]
      summary: Freeze a card
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Card frozen
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cards/{id}/unfreeze:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Cards]
      summary: Unfreeze a card
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Card unfrozen
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cards/{id}/transactions:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Cards]
      summary: List card transactions (simulated data)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Card transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        merchant:
                          type: string
                        amount:
                          type: number
                        date:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cards/{id}/limits:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Cards]
      summary: Set card daily spending limit (100–50000)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dailyLimit]
              properties:
                dailyLimit:
                  type: number
                  minimum: 100
                  maximum: 50000
            example:
              dailyLimit: 2000
      responses:
        '200':
          description: Limit updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
